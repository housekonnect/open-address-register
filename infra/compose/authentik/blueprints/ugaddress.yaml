# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Identity setup of the National Address Register, applied automatically by the Authentik worker.
# Secrets and the public URLs come from environment variables (see .env.example); nothing secret is committed.
#
# Creates:
#   * OIDC applications for the console (code flow), portal (code flow) and field app (code flow + PKCE)
#   * the API audience `ugaddress-api` (client credentials, for partners)
#   * the groups custodian-editor, custodian-approver, field-verifier, steward-admin
#   * one synthetic test user per group (see README)
#   * the login flow `ugaddress-authentication`, which requires MFA (TOTP or WebAuthn) for custodian-editor,
#     custodian-approver and steward-admin, and is the default brand's authentication flow
version: 1
metadata:
  name: UGAddress bootstrap
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # The MFA section below reuses stages from authentik's default blueprints; make sure they exist first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: "Default - Authentication flow"}
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: "Default - TOTP MFA setup flow"}
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: "Default - WebAuthn MFA setup flow"}
      required: true

  # --- Groups (= roles) --------------------------------------------------------------------------------------------
  - model: authentik_core.group
    id: group-editor
    identifiers: {name: custodian-editor}
    attrs: {name: custodian-editor}
  - model: authentik_core.group
    id: group-approver
    identifiers: {name: custodian-approver}
    attrs: {name: custodian-approver}
  - model: authentik_core.group
    id: group-verifier
    identifiers: {name: field-verifier}
    attrs: {name: field-verifier}
  - model: authentik_core.group
    id: group-steward
    identifiers: {name: steward-admin}
    attrs: {name: steward-admin}

  # --- Claims ------------------------------------------------------------------------------------------------------
  # Only the custodian code; group names already come with the profile scope (`groups` claim).
  - model: authentik_providers_oauth2.scopemapping
    id: scope-ugaddress
    identifiers: {name: "UGAddress: custodian and roles"}
    attrs:
      name: "UGAddress: custodian and roles"
      scope_name: ugaddress
      description: Custodian of the register user
      expression: |
        return {
            "custodian": request.user.attributes.get("custodian"),
        }
  - model: authentik_providers_oauth2.scopemapping
    id: scope-partner
    identifiers: {name: "UGAddress: partner access"}
    attrs:
      name: "UGAddress: partner access"
      scope_name: "register:partner"
      description: Unlocks residential entrance coordinates (partners only)
      expression: |
        return {}

  # --- Providers ---------------------------------------------------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-console
    identifiers: {name: ugaddress-console}
    attrs:
      name: ugaddress-console
      client_type: confidential
      client_id: ugaddress-console
      client_secret: !Env CONSOLE_CLIENT_SECRET
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_token_validity: minutes=15
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/api/auth/callback", !Env CONSOLE_PUBLIC_URL]
        - matching_mode: strict
          url: !Format ["%s/", !Env CONSOLE_PUBLIC_URL]
          redirect_uri_type: logout
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-ugaddress

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-portal
    identifiers: {name: ugaddress-portal}
    attrs:
      name: ugaddress-portal
      client_type: confidential
      client_id: ugaddress-portal
      client_secret: !Env PORTAL_CLIENT_SECRET
      grant_types: [authorization_code]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/api/auth/callback", !Env PORTAL_PUBLIC_URL]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-field
    identifiers: {name: ugaddress-field}
    attrs:
      name: ugaddress-field
      # Public client: the app cannot keep a secret, so it uses PKCE.
      client_type: public
      client_id: ugaddress-field
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_token_validity: minutes=15
      refresh_token_validity: days=14
      redirect_uris:
        - matching_mode: regex
          url: "^ugaddress://.*$"
        - matching_mode: regex
          url: "^exp://.*$"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf scope-ugaddress

  # The register API as an audience of its own: partners obtain tokens with client credentials.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-api
    identifiers: {name: ugaddress-api}
    attrs:
      name: ugaddress-api
      client_type: confidential
      client_id: ugaddress-api
      client_secret: !Env API_CLIENT_SECRET
      grant_types: [client_credentials]
      redirect_uris: []
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      property_mappings:
        - !KeyOf scope-partner

  # --- Applications ------------------------------------------------------------------------------------------------
  - model: authentik_core.application
    identifiers: {slug: ugaddress-console}
    attrs:
      name: UGAddress Console
      provider: !KeyOf provider-console
      meta_launch_url: !Env CONSOLE_PUBLIC_URL
  - model: authentik_core.application
    identifiers: {slug: ugaddress-portal}
    attrs:
      name: UGAddress Portal
      provider: !KeyOf provider-portal
      meta_launch_url: !Env PORTAL_PUBLIC_URL
  - model: authentik_core.application
    identifiers: {slug: ugaddress-field}
    attrs:
      name: UGAddress Field
      provider: !KeyOf provider-field
  - model: authentik_core.application
    identifiers: {slug: ugaddress-api}
    attrs:
      name: UGAddress API
      provider: !KeyOf provider-api
      meta_hide: true

  # --- Synthetic test users, one per group (local development only) ------------------------------------------------
  - model: authentik_core.user
    identifiers: {username: editor}
    attrs:
      username: editor
      name: Demo Editor
      email: editor@ugaddress.invalid
      password: !Env TEST_USER_PASSWORD
      attributes: {custodian: demo-city}
      groups: [!KeyOf group-editor]
  - model: authentik_core.user
    identifiers: {username: approver}
    attrs:
      username: approver
      name: Demo Approver
      email: approver@ugaddress.invalid
      password: !Env TEST_USER_PASSWORD
      attributes: {custodian: demo-city}
      # Also an editor, so that one person can propose a change and see the four-eyes rule stop them approving it.
      groups: [!KeyOf group-approver, !KeyOf group-editor]
  - model: authentik_core.user
    identifiers: {username: verifier}
    attrs:
      username: verifier
      name: Demo Verifier
      email: verifier@ugaddress.invalid
      password: !Env TEST_USER_PASSWORD
      attributes: {custodian: demo-city}
      groups: [!KeyOf group-verifier]
  - model: authentik_core.user
    identifiers: {username: steward}
    attrs:
      username: steward
      name: Demo Steward
      email: steward@ugaddress.invalid
      password: !Env TEST_USER_PASSWORD
      attributes: {custodian: demo-ministry}
      groups: [!KeyOf group-steward]

  # --- MFA for custodians and administrators -----------------------------------------------------------------------
  # Everything here is in authentik's open-source (MIT) code: authenticator stages, flows and policy bindings.
  # There is deliberately no setting that turns MFA off.
  - model: authentik_flows.flow
    id: flow-authentication
    identifiers: {slug: ugaddress-authentication}
    attrs:
      name: UGAddress login
      title: National Address Register
      designation: authentication
      authentication: none

  # Validates a TOTP or WebAuthn device; a user without one must enrol one before continuing.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: stage-mfa-required
    identifiers: {name: ugaddress-mfa-required}
    attrs:
      device_classes: [totp, webauthn]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
      webauthn_user_verification: preferred
      last_auth_threshold: seconds=0

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-authentication
      stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-authentication
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      order: 20
    attrs:
      re_evaluate_policies: true

  # Required MFA for the three groups. The user is only known after identification, so the binding is evaluated
  # when the stage is reached, not when the flow is planned; any one group membership is enough.
  - model: authentik_flows.flowstagebinding
    id: binding-mfa-required
    identifiers:
      target: !KeyOf flow-authentication
      stage: !KeyOf stage-mfa-required
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf binding-mfa-required, group: !KeyOf group-editor, order: 0}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf binding-mfa-required, group: !KeyOf group-approver, order: 1}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf binding-mfa-required, group: !KeyOf group-steward, order: 2}

  # Everyone else (field verifiers): authentik's default, optional MFA check, so nobody is asked twice.
  - model: authentik_flows.flowstagebinding
    id: binding-mfa-optional
    identifiers:
      target: !KeyOf flow-authentication
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 40
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf binding-mfa-optional, group: !KeyOf group-editor, order: 0}
    attrs: {negate: true}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf binding-mfa-optional, group: !KeyOf group-approver, order: 1}
    attrs: {negate: true}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf binding-mfa-optional, group: !KeyOf group-steward, order: 2}
    attrs: {negate: true}

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-authentication
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100

  # Every login of this authentik instance (console, field app, admin interface) goes through this flow.
  - model: authentik_brands.brand
    identifiers: {domain: authentik-default}
    attrs:
      flow_authentication: !KeyOf flow-authentication
