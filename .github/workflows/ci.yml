name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (verify, Testcontainers, Modulith, ArchUnit, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: ./mvnw verify
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-sbom
          path: backend/target/bom.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: register-app-jar
          path: backend/register-app/target/register-app.jar
          retention-days: 1

  contracts:
    name: Contracts (lint, generated code up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
      - run: pnpm install --frozen-lockfile
      - name: Lint OpenAPI contract (Redocly)
        run: pnpm contracts:lint
      - name: Regenerate TypeScript client
        run: pnpm generate
      - name: Fail if generated code is out of date
        run: git diff --exit-code -- packages/api-client || (echo "::error::Generated API client is stale. Run 'make generate' and commit." && exit 1)

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter "./packages/*" --filter @ugaddress/portal --filter @ugaddress/console run lint
      - name: Type-check (tsc --noEmit)
        run: pnpm --filter "./packages/*" --filter @ugaddress/portal --filter @ugaddress/console run typecheck
      - name: Test
        run: pnpm --filter "./packages/*" --filter @ugaddress/portal --filter @ugaddress/console run test
      - name: Build portal and console
        run: pnpm --filter @ugaddress/portal --filter @ugaddress/console run build
      - name: CycloneDX SBOM (npm dependencies)
        run: pnpm sbom --sbom-format cyclonedx --prod --out "sbom/%s.cdx.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-sboms
          path: sbom/

  field:
    name: Field app (lint, types, offline queue tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ugaddress/field run lint
      - run: pnpm --filter @ugaddress/field run typecheck
      - run: pnpm --filter @ugaddress/field run test

  trivy-fs:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      # Trivy resolves Maven dependencies from the local repository; filling it avoids remote rate limits.
      - name: Resolve Maven dependencies
        working-directory: backend
        run: ./mvnw -B -ntp -q install -DskipTests
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules,backend/register-app/target

  trivy-images:
    name: Trivy (images)
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        image: [backend, portal, console]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        if: matrix.image == 'backend'
        with:
          name: register-app-jar
          path: backend/register-app/target
      - name: Build image
        run: |
          case "${{ matrix.image }}" in
            backend) docker build -t ugaddress/${{ matrix.image }}:ci backend/register-app ;;
            *) docker build -t ugaddress/${{ matrix.image }}:ci -f apps/${{ matrix.image }}/Dockerfile . ;;
          esac
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ugaddress/${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
