packages:
  - apps/*
  - packages/*
allowBuilds:
  '@openapitools/openapi-generator-cli': false
  '@parcel/watcher': false
  '@swc/core': false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@redocly/cli@2.60.0'
  - lucide-react@1.53.0
  - '@playwright/test@1.64.0'
  - playwright-core@1.64.0
  - playwright@1.64.0
overrides:
  # Security: transitive dependency of the React Native tooling (CVE-2026-102422).
  shell-quote: 1.12.0
